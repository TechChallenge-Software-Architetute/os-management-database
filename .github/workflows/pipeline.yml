name: "Terraform Aurora Deployment"

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  id-token: write
  
jobs:

  preflight:
    name: "Preflight (PR → develop)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform fmt & init (no backend)
        run: |
          terraform fmt -recursive
          terraform init -backend=false

      - name: Terraform validate (placeholders)
        run: |
          cat > ci-placeholder.auto.tfvars <<EOF
          vpc_id = "placeholder"
          subnet_ids = ["subnet-1","subnet-2"]
          db_username = "admin"
          db_password = "placeholder"
          EOF
          terraform validate

  deploy:
    name: "Terraform Deploy (push → develop)"
    needs: []
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    env:
      TF_VAR_vpc_id: ${{ secrets.VPC_ID }}
      TF_VAR_subnet_ids: ${{ secrets.SUBNET_IDS }}   # deve ser '["subnet-1","subnet-2"]'
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      AWS_REGION: "us-east-1"
      TF_STATE_BUCKET: "tfstate-backend-fiap-soat-giovanni"
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      # ou substitua a step acima por OIDC: role-to-assume + id-token: write nas permissions

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Init
        shell: bash
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "O segredo TF_STATE_BUCKET não está configurado."
            exit 1
          fi

          terraform init \
            -input=false \
            -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=os-management-database/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: Import existing AWS resources when state is empty
        shell: bash
        run: |
          import_if_missing() {
            local address="$1"
            local resource_id="$2"

            if ! terraform state show "$address" >/dev/null 2>&1; then
              terraform import -input=false "$address" "$resource_id"
            fi
          }

          subnet_group_name="aurora-workshop-subnet-group"
          subnet_group_exists=$(aws rds describe-db-subnet-groups \
            --db-subnet-group-name "$subnet_group_name" \
            --query 'DBSubnetGroups[0].DBSubnetGroupName' \
            --output text 2>/dev/null || true)
          if [ "$subnet_group_exists" != "None" ] && [ -n "$subnet_group_exists" ]; then
            import_if_missing "aws_db_subnet_group.aurora_subnets" "$subnet_group_name"
          fi

          security_group_id=$(aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=${TF_VAR_vpc_id}" "Name=group-name,Values=aurora-security-group" \
            --query 'SecurityGroups[0].GroupId' \
            --output text 2>/dev/null || true)
          if [ "$security_group_id" != "None" ] && [ -n "$security_group_id" ]; then
            import_if_missing "aws_security_group.aurora_sg" "$security_group_id"
          fi

          cluster_exists=$(aws rds describe-db-clusters \
            --db-cluster-identifier workshop \
            --query 'DBClusters[0].DBClusterIdentifier' \
            --output text 2>/dev/null || true)
          if [ "$cluster_exists" != "None" ] && [ -n "$cluster_exists" ]; then
            import_if_missing "aws_rds_cluster.aurora" "workshop"
          fi

          instance_exists=$(aws rds describe-db-instances \
            --db-instance-identifier workshop-aurora-instance-1 \
            --query 'DBInstances[0].DBInstanceIdentifier' \
            --output text 2>/dev/null || true)
          if [ "$instance_exists" != "None" ] && [ -n "$instance_exists" ]; then
            import_if_missing "aws_rds_cluster_instance.aurora_instance" "workshop-aurora-instance-1"
          fi

      - name: Terraform Plan (save tfplan)
        run: |
          terraform plan -input=false -no-color -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/terraform/tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan