name: "Terraform Aurora Deployment"

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  id-token: write
  
jobs:

  preflight:
    name: "Preflight (PR → develop)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform fmt & init (no backend)
        run: |
          terraform fmt -recursive
          terraform init -backend=false

      - name: Terraform validate (placeholders)
        run: |
          terraform validate -var='vpc_id=placeholder' \
                            -var='subnet_ids=["subnet-1","subnet-2"]' \
                            -var='db_username=admin' \
                            -var='db_password=placeholder'

  deploy:
    name: "Terraform Deploy (push → develop)"
    needs: []
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    env:
      TF_VAR_vpc_id: ${{ secrets.VPC_ID }}
      TF_VAR_subnet_ids: ${{ secrets.SUBNET_IDS }}   # deve ser '["subnet-1","subnet-2"]'
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      AWS_REGION: "us-east-1"
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      # ou substitua a step acima por OIDC: role-to-assume + id-token: write nas permissions

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan (save tfplan)
        run: |
          terraform plan -input=false -no-color -out=tfplan -refresh=false

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/terraform/tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan